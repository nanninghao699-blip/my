<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>万象数字馆</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; margin: 0; font-family: sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState } = React;

        function App() {
            const [tab, setTab] = useState('灵感');
            return (
                <div className="min-h-screen flex flex-col p-4">
                    <header className="flex justify-between items-center mb-6">
                        <h1 className="text-2xl font-bold text-blue-400">万象数字馆</h1>
                        <div className="bg-blue-500/20 px-3 py-1 rounded-full text-xs text-blue-300">科研模式</div>
                    </header>

                    <div className="space-y-4 flex-1">
                        <input type="text" placeholder="搜索你的科研灵感..." className="w-full glass rounded-2xl p-4 outline-none focus:ring-2 focus:ring-blue-500" />
                        <div className="flex gap-2 overflow-x-auto pb-2 text-sm">
                            {["#计算化学", "#Photocycloaddition", "#考公", "#Gaussian"].map(t => (
                                <span key={t} className="glass px-3 py-1 rounded-full whitespace-nowrap">{t}</span>
                            ))}
                        </div>
                        <div className="glass rounded-3xl p-8 text-center">
                            <div className="text-4xl mb-4">🧠</div>
                            <h2 className="text-lg font-medium">你的第二大脑已就绪</h2>
                            <p className="text-gray-400 text-sm mt-2">数据将自动加密保存在你的真我手机本地</p>
                        </div>
                    </div>

                    <nav className="fixed bottom-6 left-6 right-6 p-4 glass rounded-full flex justify-around shadow-2xl">
                        {['灵感', '读书', '笔记'].map(t => (
                            <button key={t} onClick={() => setTab(t)} className={tab === t ? 'text-blue-400 font-bold' : 'text-gray-500'}>{t}</button>
                        ))}
                    </nav>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
